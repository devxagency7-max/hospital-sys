<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="نظام إدارة مستشفى — واجهة عربية" />

    <title>Hospital ERP</title>

    <!--
      الخط من Google Fonts مؤقتًا. قبل التسليم النهائي يُستضاف محليًا في
      assets/fonts/ — شبكة المستشفى قد تكون مغلقة على الإنترنت الخارجي.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- ملف مُولَّد عبر `npm run build`. لا تحرّره — المصدر css/tailwind.src.css -->
    <link rel="stylesheet" href="css/app.css" />

    <link rel="icon" href="data:," />
  </head>

  <body>
    <!-- الإطار كله يُبنى في JS. هذا العنصر هو نقطة التركيب الوحيدة. -->
    <div id="app"></div>

    <!--
      رسالة احتياطية: لو لم يُحمَّل الـ JS لأي سبب، تبقى الصفحة بيضاء تمامًا
      بلا تفسير. هذا العنصر يُحذف من داخل app.js بعد نجاح الإقلاع.
    -->
    <noscript>
      <div style="padding: 2rem; font-family: Tahoma, sans-serif; text-align: center">
        <h1 style="font-size: 1.125rem">هذا التطبيق يحتاج JavaScript</h1>
        <p style="color: #5a6677; margin-top: 0.5rem">فضلاً مكّن JavaScript في المتصفح ثم أعد تحميل الصفحة.</p>
      </div>
    </noscript>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
